<div *ngIf="isOpen" class="modal-backdrop-custom fade show"></div>

<div *ngIf="isOpen" class="modal-dialog-centered-custom fade show" role="dialog" aria-modal="true" tabindex="-1">
  <div class="custom-modal-card">
    
    <!-- Modal Header -->
    <div class="custom-modal-header">
      <div class="d-flex align-items-center gap-2">
        <i class="fa-solid fa-arrow-right-arrow-left text-primary"></i>
        <h6 class="modal-title-custom mb-0">Update Task Status & Remarks</h6>
      </div>
      <button type="button" class="btn-close-custom" aria-label="Close" (click)="onCancel()" [disabled]="isSubmitting">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="custom-modal-body">
      
      <!-- Task Summary Context -->
      <div *ngIf="task" class="task-info-box mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span class="task-code-badge">{{ task.taskCode }}</span>
          <span class="text-muted small" *ngIf="task.departmentName">
            <i class="fa-regular fa-building me-1"></i>{{ task.departmentName }}
          </span>
        </div>
        <div class="task-subject-text">{{ task.subject }}</div>
      </div>

      <!-- Transition Flow Indicator -->
      <div class="transition-flow-box mb-3">
        <div class="status-chip" [ngClass]="fromStatusBadgeClass">
          <span class="dot-indicator"></span>
          {{ fromStatus || 'UNKNOWN' }}
        </div>
        <div class="arrow-indicator">
          <i class="fa-solid fa-arrow-right"></i>
        </div>
        <div class="status-chip" [ngClass]="toStatusBadgeClass">
          <span class="dot-indicator"></span>
          {{ toStatus || 'UNKNOWN' }}
        </div>
      </div>

      <!-- Remarks Input -->
      <div class="mb-2">
        <label class="form-label-mini mb-1">
          Transition Remarks
          <span *ngIf="isRemarksRequired" class="text-danger">*</span>
          <span *ngIf="!isRemarksRequired" class="text-muted fw-normal">(Optional)</span>
        </label>
        <textarea
          [(ngModel)]="remarks"
          name="transitionRemarks"
          class="form-control form-control-sm remarks-textarea"
          rows="3"
          placeholder="Enter reason or comments for this status transition..."
          [disabled]="isSubmitting"
          maxlength="500"
        ></textarea>
        <div class="d-flex justify-content-between align-items-center mt-1">
          <span *ngIf="errorMessage" class="text-danger small validation-msg">
            <i class="fa-solid fa-circle-exclamation me-1"></i>{{ errorMessage }}
          </span>
          <span *ngIf="!errorMessage"></span>
          <span class="char-count text-muted">{{ (remarks || '').length }}/500</span>
        </div>
      </div>

    </div>

    <!-- Modal Footer -->
    <div class="custom-modal-footer">
      <button type="button" class="btn btn-secondary-action btn-sm" (click)="onCancel()" [disabled]="isSubmitting">
        Cancel
      </button>
      <button type="button" class="btn btn-primary-action btn-sm" (click)="onConfirm()" [disabled]="isSubmitting">
        <i *ngIf="isSubmitting" class="fa-solid fa-spinner fa-spin me-1"></i>
        <i *ngIf="!isSubmitting" class="fa-solid fa-check me-1"></i>
        Confirm & Move
      </button>
    </div>

  </div>
</div>
