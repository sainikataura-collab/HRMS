<section>
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-12 col-md-12 col-lg-12">
        <div class="card">
          <div class="card-header bg-blue">
            <div class="row w-100">
              <div class="col-sm-12 col-md-6 col-lg-6">
                <h4>Life Insurance Verification</h4>
              </div>
            </div>
          </div>

          <div class="card-body mt-2">
            <!-- ====================== VIEW MODE ====================== -->
            <div *ngIf="isViewMode && lifeInsuranceData">
              <div class="row">
                <div class="col-md-4">
                  <label class="text-muted">Policy Number:</label>
                  <p class="fs-5">
                    <strong>{{ lifeInsuranceData.lifeInsurance_No || 'N/A' }}</strong>
                  </p>
                </div>

                <div class="col-md-6" *ngIf="lifeInsuranceData.lifeInsurance_Photo_url">
                  <label class="fw-semibold">Life Insurance Document / Photo</label><br />
                  <img
                    [src]="lifeInsuranceData.lifeInsurance_Photo_url"
                    alt="Life Insurance"
                    class="img-thumbnail my-2"
                    style="
                      max-width: 320px;
                      max-height: 200px;
                      object-fit: contain;
                      cursor: pointer;
                    "
                  />
                </div>

                <div class="col-12 mt-3">
                  <button type="button" class="btn btn-warning" (click)="editLifeInsurance()">
                    <i class="fas fa-edit me-1"></i> Edit Life Insurance
                  </button>
                </div>
              </div>
            </div>

            <!-- ====================== FORM MODE ====================== -->
            <form *ngIf="!isViewMode" [formGroup]="lifeInsuranceForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <!-- Policy Number -->
                <div class="col-sm-12 col-md-6 col-lg-4">
                  <label>
                    Policy / Insurance Number
                    <span class="text-danger" *ngIf="isLifeInsuranceMandatory">*</span>
                  </label>
                  <div class="input-group">
                    <span class="input-group-text">
                      <i class="fas fa-file-contract"></i>
                    </span>
                    <input
                      type="text"
                      class="form-control text-uppercase"
                      formControlName="lifeInsurance_No"
                      placeholder="Enter Policy Number"
                      maxlength="30"
                    />
                  </div>
                  <div
                    *ngIf="(submitted || validate['lifeInsurance_No'].touched) && validate['lifeInsurance_No'].errors"
                    class="text-danger mt-1 small"
                  >
                    <div *ngIf="validate['lifeInsurance_No'].errors['required']">
                      Policy Number is required.
                    </div>
                    <div *ngIf="validate['lifeInsurance_No'].errors['pattern']">
                      Please enter a valid Policy Number.
                    </div>
                  </div>
                </div>

                <!-- Life Insurance Document Upload -->
                <div class="col-sm-12 col-md-6 col-lg-5">
                  <label>
                    Upload Life Insurance Document / Photo
                    <span class="text-danger" *ngIf="isLifeInsuranceMandatory && !lifeInsuranceData?.lifeInsurance_Photo">*</span>
                  </label>
                  <div class="input-group">
                    <input
                      type="file"
                      class="form-control"
                      (change)="onFileSelected($event, 'lifeInsurancePhotoFile')"
                      accept="image/jpeg,image/png,image/jpg,application/pdf"
                    />
                  </div>
                  <small class="text-muted">Allowed: JPG, PNG, PDF (Max 5MB)</small>
                  <div
                    *ngIf="submitted && validate['lifeInsurancePhotoFile'].errors && isLifeInsuranceMandatory && !lifeInsuranceData?.lifeInsurance_Photo"
                    class="text-danger mt-1 small"
                  >
                    Please upload Life Insurance document.
                  </div>

                  <!-- Image Preview -->
                  <div *ngIf="previewImage" class="mt-2">
                    <img
                      [src]="previewImage"
                      alt="Life Insurance Preview"
                      class="img-thumbnail"
                      style="max-width: 250px; max-height: 160px; object-fit: contain;"
                    />
                  </div>
                </div>
              </div>

              <!-- Submit Buttons -->
              <div class="row mt-4">
                <div class="col-12">
                  <button type="submit" class="btn btn-primary me-2">
                    <i class="fas fa-save me-1"></i> Save & Continue
                  </button>
                  <button type="button" class="btn btn-secondary" (click)="reset()">
                    Reset
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
